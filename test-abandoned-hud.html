<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exit Abandon Test - Abandoned Flash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #ui-overlay {
            position: relative;
            width: 1280px;
            height: 720px;
            margin: 20px auto;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border: 2px solid #533483;
        }
        
        #sol-hud {
            position: absolute;
            top: 60px;
            left: 20px;
            background: linear-gradient(135deg, rgba(15, 20, 30, 0.92), rgba(20, 25, 35, 0.88));
            border: 1px solid rgba(100, 120, 140, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            font-size: 14px;
            color: white;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="sol-hud">Abandoned — no pay</div>
        <div id="instructions">
            This shows the "Abandoned — no pay" HUD message that appears when<br>
            exiting a building during an in-progress job (LearnRunner, CareerRunner, or FreelanceSystem).<br>
            <br>
            <strong>Evidence for PR #22 exit-abandon implementation</strong><br>
            Message flashes for 1.5s in the same style as payout messages.
        </div>
    </div>
    
    <script>
        // Auto-hide after 1.5s to demonstrate the flash behavior
        setTimeout(() => {
            document.getElementById('sol-hud').style.opacity = '0';
        }, 1500);
    </script>
</body>
</html>
