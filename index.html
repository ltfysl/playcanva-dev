<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dev Tycoon - City Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #application-canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, rgba(15, 20, 30, 0.92), rgba(20, 25, 35, 0.88));
            border: 1px solid rgba(100, 120, 140, 0.4);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 10px;
        }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(15, 20, 30, 0.92), rgba(20, 25, 35, 0.88));
            border: 1px solid rgba(100, 120, 140, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        #location-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(15, 20, 30, 0.92), rgba(20, 25, 35, 0.88));
            border: 1px solid rgba(100, 120, 140, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            font-size: 16px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="application-canvas"></canvas>
    
    <div id="ui-overlay">
        <div id="location-indicator">Downtown District</div>
        <div id="minimap">
            <canvas id="minimap-canvas"></canvas>
        </div>
        <div id="controls-hint">
            <strong>Controls:</strong><br>
            WASD - Move<br>
            Mouse - Look Around<br>
            E - Enter/Exit Buildings<br>
            Click to lock cursor
        </div>
    </div>
    
    <div class="loading" id="loading">Loading Dev Tycoon...</div>

    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
    <script src="https://code.playcanvas.com/ammo.wasm.js"></script>
    <script src="src/core/config.js"></script>
    <script src="src/core/city-module.js"></script>
    <script src="src/core/game-manager.js"></script>
    <script src="src/player/player-controller.js"></script>
    <script src="src/city/city-generator.js"></script>
    <script src="src/city/district.js"></script>
    <script src="src/buildings/building.js"></script>
    <script src="src/buildings/home-interior.js"></script>
    <script src="src/systems/lighting-system.js"></script>
    <script src="src/ui/minimap.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
